# Rushia DL Nginx Configuration
# このファイルはテンプレートです。直接編集しないでください。
# 設定を生成するには: ./scripts/generate-nginx-config.sh <ドメイン名>

# HTTP → HTTPS リダイレクト & ACME チャレンジ
server {
    listen 80;
    listen [::]:80;
    server_name rushiadl.holosco.pe;

    # Let's Encrypt ACME チャレンジ用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # その他のリクエストはHTTPSにリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS サーバー
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rushiadl.holosco.pe;

    # SSL 証明書
    ssl_certificate /etc/letsencrypt/live/rushiadl.holosco.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rushiadl.holosco.pe/privkey.pem;

    # SSL 設定（セキュリティ強化）
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # 🔒 Basic認証（身内限定アクセス）
    # ============================================
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ============================================
    # 🔒 IPアドレス制限（オプション：必要に応じてコメントを外す）
    # ============================================
    # 許可するIPアドレスを追加
    # allow 123.456.789.0;    # 友達AのIP
    # allow 123.456.789.1;    # 友達BのIP
    # deny all;               # 上記以外は全て拒否

    # プロキシ設定
    location / {
        proxy_pass http://rushia-dl:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # タイムアウト設定（長時間ダウンロード対応）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # POST /api/download 用（末尾スラッシュ無しを直にbackendへ）
    location = /api/download {
        # ここは Basic 認証を維持したいなら off しない（親の auth_basic を継承）
        proxy_pass http://rushia-dl:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 実ファイルDLだけ Basic 認証を外す（/api/download/<filename>）
    location ^~ /api/download/ {
        auth_basic off;
    
        proxy_pass http://rushia-dl:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
