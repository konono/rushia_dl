name: Update yt-dlp

on:
  schedule:
    # 毎日午前3時（UTC）にチェック（日本時間では12時）
    - cron: '0 3 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Get current yt-dlp version
        id: current-version
        run: |
          # uv.lockから現在のバージョンを取得
          CURRENT=$(grep -A 5 'name = "yt-dlp"' uv.lock | grep 'version =' | head -1 | sed 's/.*version = "\(.*\)".*/\1/' || echo "")
          if [ -z "$CURRENT" ]; then
            # pyproject.tomlから取得を試みる
            CURRENT=$(grep 'yt-dlp' pyproject.toml | grep -oP 'yt-dlp[>=<]*([0-9.]+)?' | sed 's/yt-dlp[>=<]*//' || echo "unknown")
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current yt-dlp version: $CURRENT"

      - name: Get latest yt-dlp version
        id: latest-version
        run: |
          # PyPI APIから最新バージョンを取得
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])" || echo "unknown")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest yt-dlp version: $LATEST"

      - name: Check if update is needed
        id: check-update
        run: |
          if [ "${{ steps.current-version.outputs.current }}" != "${{ steps.latest-version.outputs.latest }}" ] && [ "${{ steps.latest-version.outputs.latest }}" != "unknown" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current-version.outputs.current }} -> ${{ steps.latest-version.outputs.latest }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          fi

      - name: Update yt-dlp
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          uv sync --upgrade-package yt-dlp
          uv lock

      - name: Check for changes
        if: steps.check-update.outputs.update_needed == 'true'
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-update.outputs.update_needed == 'true' && steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update yt-dlp to ${{ steps.latest-version.outputs.latest }}"
          title: "chore: Update yt-dlp to ${{ steps.latest-version.outputs.latest }}"
          body: |
            ## yt-dlp Update

            - **Current version**: ${{ steps.current-version.outputs.current }}
            - **Latest version**: ${{ steps.latest-version.outputs.latest }}

            This PR was automatically created by the update workflow.

            ### Changes
            - Updated `yt-dlp` dependency
            - Updated `uv.lock` file

            ### Testing
            Please test the application to ensure everything works correctly with the new version.

          branch: update/yt-dlp-${{ steps.latest-version.outputs.latest }}
          delete-branch: true
          labels: |
            dependencies
            automated

