---
services:
  nginx:
    image: nginx:alpine
    container_name: rushia-nginx
    networks:
      - rushia_ipv6
    ports:
      - "[::]:80:80"
      - "[::]:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro,z
      - ./certbot/conf:/etc/letsencrypt:ro,z
      - ./certbot/www:/var/www/certbot:ro,z
    depends_on:
      - rushia-dl
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # compose run --rm certbot renew で利用するユーティリティサービス
  # 証明書更新は systemd タイマー (rushia-certbot.timer) が実行する
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: rushia-certbot
    networks:
      - rushia_ipv6
    volumes:
      - ./certbot/conf:/etc/letsencrypt:z
      - ./certbot/secrets:/run/secrets:ro,z

  rushia-dl:
    build:
      context: .
      dockerfile: Dockerfile
    image: rushia-dl:latest
    container_name: rushia-dl
    networks:
      rushia_ipv6:
        aliases:
          - rushia-dl
    expose:
      - "8000"
    volumes:
      - ./downloads:/app/downloads:z
      - ./cookies:/app/.cookies:z
      - ./yt-dlp.conf:/etc/yt-dlp.conf:ro,z
      - ./scripts/smoke-test.sh:/app/scripts/smoke-test.sh:ro,z
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rushia_ipv6:
    name: rushia_ipv6
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "10.89.0.0/24"
        - subnet: "fd10:89::/64"
