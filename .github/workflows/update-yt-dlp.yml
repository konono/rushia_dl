name: Update yt-dlp

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get current yt-dlp version
        id: current-version
        run: |
          CURRENT=$(grep -A 5 'name = "yt-dlp"' uv.lock | grep 'version =' | head -1 | sed 's/.*version = "\(.*\)".*/\1/' || echo "unknown")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current yt-dlp version: $CURRENT"

      - name: Get latest yt-dlp version
        id: latest-version
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])" || echo "unknown")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest yt-dlp version: $LATEST"

      - name: Check if update is needed
        id: check-update
        run: |
          if [ "${{ steps.current-version.outputs.current }}" != "${{ steps.latest-version.outputs.latest }}" ] && [ "${{ steps.latest-version.outputs.latest }}" != "unknown" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          fi

      - name: Update yt-dlp and regenerate requirements.txt
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          uv sync --upgrade-package yt-dlp
          uv lock
          uv export --format requirements-txt --no-hashes --no-dev --no-emit-project --quiet > requirements.txt

      - name: Check for changes
        if: steps.check-update.outputs.update_needed == 'true'
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        if: steps.check-update.outputs.update_needed == 'true' && steps.check-changes.outputs.has_changes == 'true'
        run: docker build -t rushia-dl:test .

      - name: Run smoke test
        if: steps.check-update.outputs.update_needed == 'true' && steps.check-changes.outputs.has_changes == 'true'
        run: |
          chmod +x scripts/smoke-test-container.sh scripts/smoke-test.sh
          ./scripts/smoke-test-container.sh \
            --image rushia-dl:test \
            --ci \
            --output smoke-test-results.md \
            | tee smoke-test-output.txt

      - name: Save smoke test results
        if: steps.check-update.outputs.update_needed == 'true' && steps.check-changes.outputs.has_changes == 'true'
        id: test-results
        run: |
          if [ -f smoke-test-results.md ]; then
            {
              echo "results<<SMOKE_EOF"
              cat smoke-test-results.md
              echo "SMOKE_EOF"
            } >> $GITHUB_OUTPUT
          elif [ -f smoke-test-output.txt ]; then
            {
              echo "results<<SMOKE_EOF"
              echo '### Smoke Test Results'
              echo '```'
              cat smoke-test-output.txt
              echo '```'
              echo "SMOKE_EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "results=Smoke test results unavailable" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-update.outputs.update_needed == 'true' && steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update yt-dlp to ${{ steps.latest-version.outputs.latest }}"
          title: "chore: Update yt-dlp to ${{ steps.latest-version.outputs.latest }}"
          body: |
            ## yt-dlp Update

            - **Current version**: ${{ steps.current-version.outputs.current }}
            - **Latest version**: ${{ steps.latest-version.outputs.latest }}

            ### Changes
            - Updated `yt-dlp` dependency
            - Updated `uv.lock`
            - Regenerated `requirements.txt`

            ${{ steps.test-results.outputs.results }}

          branch: update/yt-dlp-${{ steps.latest-version.outputs.latest }}
          delete-branch: true
          labels: |
            dependencies
            automated
